name: ci

on:
  push:
    # main plus the long-lived hardening branches, so a branch under independent review is gated by
    # the SAME matrix as main rather than by a laptop. Feature branches are not merged to get CI.
    branches: [main, 'arp-interop-response-*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Audit every committed npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r lockfile; do
            package_dir="$(dirname "$lockfile")"
            echo "Auditing ${package_dir}"
            npm --prefix "$package_dir" audit --package-lock-only --omit=dev --audit-level=high
          done < <(find . \( -name package-lock.json -o -name npm-shrinkwrap.json \) -not -path '*/node_modules/*' -print | sort)

  extended-package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Build the root package
        run: npm ci && npm run build
      - name: BOUNDARY 2 — thrown-value handling gate (no caught value read outside the boundary)
        run: npm run lint:thrown
      - name: approval-artifacts tests
        run: cd packages/approval-artifacts && npm ci && npm test
      - name: evidence tests
        run: cd packages/evidence && npm ci && npm test
      - name: gate tests
        run: cd packages/gate && npm ci && npm test
      - name: Build signer-core for relay's local package dependency
        run: cd packages/signer-core && npm ci && npm run build
      - name: relay tests
        run: cd packages/relay && npm ci && npm test
      - name: signer-core tests
        # Built above for relay; its OWN suite was never run here. It is an INDEPENDENT signing
        # implementation (its own JCS + builder), so a producer-side invariant that holds only in
        # noa-receipt's builder is not an invariant — that gap is now covered by its nfc-universal
        # test and must be gated.
        run: cd packages/signer-core && npm test
      - name: tsa-anchor tests
        run: cd packages/tsa-anchor && npm ci && npm test
      - name: Install adapter-core for framework-adapters' local package dependency
        run: cd packages/adapter-core && npm ci
      - name: framework-adapters tests
        run: cd packages/framework-adapters && npm ci && npm test

  e2e-demo-golden-path:
    # THE GOLDEN END-TO-END PATH, GATED — as far as a public runner can gate it.
    #
    # `packages/e2e-demo` is the Instant-Tether demo: agent -> gate -> relay -> a REAL phone core ->
    # grant -> exact execution -> an offline-verifiable Approval Evidence Bundle. It was in NONE of
    # the jobs above, and its nine phone-core imports were deep relative specifiers that resolve only
    # from the maintainer's directory layout. So the end-to-end path could be broken indefinitely
    # while every check here stayed green: an unrun check and a passing check are the same value in a
    # report and opposite facts in reality.
    #
    # The phone core is a PRIVATE sibling product (NordenSoft/noa-mobile) consumed as TypeScript
    # source, and this repository is public, so a runner cannot fetch it without a credential. This
    # job therefore has two honest states and no third:
    #   • the CONTRACT check runs ALWAYS (one declared location, one import surface, no deep relative
    #     specifiers) — those are defects in THIS repo and are gated unconditionally;
    #   • the SUITE runs whenever the phone core is reachable — with the NOA_MOBILE_TOKEN secret
    #     configured, or on any runner that already has it — and a failure is a hard failure.
    # When it is not reachable the preflight prints one unmissable NOT EXECUTED line. It never
    # reports a pass for something it did not run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The `secrets` context is NOT available in a step-level `if:`; a job-level `env` is where it
      # can be read, so the presence of the credential becomes an ordinary string to branch on.
      HAS_PHONE_CORE_TOKEN: ${{ secrets.NOA_MOBILE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check out the private phone core (only when a credential is configured)
        id: phone-core
        if: env.HAS_PHONE_CORE_TOKEN == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NordenSoft/noa-mobile
          path: noa-mobile
          token: ${{ secrets.NOA_MOBILE_TOKEN }}
          persist-credentials: false
      - name: Dependency contract (ALWAYS gated) + honest presence report
        id: preflight
        run: |
          set -euo pipefail
          node scripts/e2e-demo-preflight.mjs | tee preflight.out
          if grep -q "^phone-core: PRESENT" preflight.out; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
          { echo "### e2e-demo golden path"; sed -n '1,20p' preflight.out; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the in-repo dependencies
        if: steps.preflight.outputs.present == 'true'
        run: cd packages/e2e-demo && npm ci && npm run build:deps
      - name: Typecheck the golden path
        if: steps.preflight.outputs.present == 'true'
        run: cd packages/e2e-demo && npm run typecheck
      - name: Run the 6 golden-path scenarios
        if: steps.preflight.outputs.present == 'true'
        run: cd packages/e2e-demo && npm test

  five-verifier-conformance:
    # THE FIVE-LANGUAGE INTEROP BAR, GATED. The `test` job below runs the TS<->Python conformance
    # only; Go, Rust and C# were verified on developer machines and by nothing else. That is exactly
    # the shape of gap this repository keeps finding: a rule enforced in some implementations is not
    # an invariant. Every verifier that claims conformance is now checked on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23"
      - uses: dtolnay/rust-toolchain@56f84321dbccf38fb67ce29ab63e4754056677e0 # stable
        with:
          toolchain: stable
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - name: Build + generate vectors (the corpus every verifier is held to)
        run: npm test
      - name: Go verifier == Python reference
        run: bash impl-go/conformance_test.sh
      - name: Build the Rust verifier
        # impl-rust/conformance.sh deliberately requires a pre-built binary and FATALs without one
        # (impl-go's script builds its own). A developer machine always has it from a previous run —
        # which is precisely why this only ever failed in CI.
        run: cd impl-rust && cargo build --release
      - name: Rust verifier == Python reference
        run: bash impl-rust/conformance.sh
      - name: C# verifier == Python reference
        run: bash impl-csharp/conformance.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The cross-impl conformance proof shells out to the independent Python verifier (impl-py/noa_verify.py),
      # so python3 must be on PATH for that gate to run.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build + generate vectors + test
        run: npm test
      - name: Cross-impl conformance (TS reference == independent Python verifier)
        # Gates the TS↔PY interop bar: a divergence on identical signed bytes FAILS the build (not just the
        # in-language test). Needs the dist build (npm test already built it) + python3 (set up above).
        run: |
          npm run build
          node impl-py/conformance.mjs
      - name: Conformance vectors are reproducible (no drift)
        run: |
          # catches modified AND newly-generated (untracked) vector files
          if [ -n "$(git status --porcelain conformance/)" ]; then
            echo "::error::conformance vectors changed/added — regenerate with 'npm run gen:vectors' and commit"
            git status --porcelain conformance/
            exit 1
          fi
      - name: Conformance matrix is up to date (no drift)
        # Regenerates conformance/MATRIX.md from conformance.mjs's own output and fails if it differs
        # from the committed copy (or if any vector could not be classified into a security class).
        # Same "regenerate + git-diff" discipline as the vector-drift check above, applied to the
        # derived TS↔Python pass/fail matrix so it can never silently go stale against the harness.
        run: node scripts/conformance-matrix.mjs --write && git diff --exit-code conformance/MATRIX.md
      - name: Self-check the CLI exit-code contract
        run: |
          set -e
          node dist/src/cli.js verify conformance/vectors/valid-chain.json \
            --keyring conformance/vectors/keyring.json \
            --checkpoint conformance/vectors/checkpoint.json > /dev/null
          echo "VALID -> exit $? (want 0)"
          if node dist/src/cli.js verify conformance/vectors/attack/tampered-content.json \
            --keyring conformance/vectors/keyring.json > /dev/null; then
            echo "::error::tampered vector verified as VALID"; exit 1
          else
            echo "TAMPERED -> exit $? (want non-zero)"
          fi
      - name: Dogfood pilots (PRIVATE, vitest — proxy/replay/co-attestation behaviour)
        # The dogfood harnesses under test/dogfood/ are PRIVATE/internal (not in package.json `files`)
        # and use vitest (resolved via a pinned npx, NOT a project dependency — the lib stays zero-dep).
        # `npm test` (node:test) deliberately excludes them; this gates their runtime behaviour.
        run: npm run test:dogfood
      - name: adapter-core unit tests (packages/adapter-core)
        # package-lock.json is committed here — adapter-core now depends on the published
        # noa-receipt registry package instead of importing the repo's built dist/ directly, so
        # `npm ci` is correct (and no longer needs the root build step above for this dependency).
        run: |
          cd packages/adapter-core
          npm ci
          npm test
      - name: signer-sidecar smoke test (packages/signer-sidecar)
        # Real 2-process smoke test (sidecar.mjs child process + client.mjs). Must run AFTER
        # adapter-core's own `npm ci` above (same file:../adapter-core node_modules-population
        # reason the mcp-proxy step below already documents) and BEFORE mcp-proxy's own step
        # (mcp-proxy's --signer-socket integration test spawns THIS package's sidecar.mjs
        # directly by relative path, so it must already have its own node_modules populated).
        run: |
          cd packages/signer-sidecar
          npm ci
          npm test
      - name: mcp-proxy smoke test (packages/mcp-proxy)
        # Real-transport smoke test: fail-closed DENY, live tools/list reflection, session
        # isolation, persist-then-commit ordering, and CLI double-stdio integration.
        # Must run AFTER the adapter-core AND signer-sidecar steps above: mcp-proxy links both
        # via file:../adapter-core and file:../signer-sidecar, and Node resolves each one's own
        # dependencies from ITS OWN node_modules — populated only by that package's own `npm ci`
        # (npm does not install a file: dep's dependencies across the link boundary).
        # Do not split these three steps into parallel jobs.
        run: |
          cd packages/mcp-proxy
          npm ci
          npm test
      - name: tsa-anchor unit tests (packages/tsa-anchor)
        # RFC 3161 DER encode/decode, TimeStampReq/Resp, client self-checks, verifyStamp, CLI.
        # UNLIKE adapter-core (which uses the PUBLISHED noa-receipt), tsa-anchor depends on the
        # LOCAL repo via `noa-receipt: file:../..`, so `npm ci` here just symlinks node_modules/
        # noa-receipt -> the repo root, and `import "noa-receipt"` resolves to the root's built
        # dist/ (main: dist/src/index.js). That dist/ already exists because the conformance step
        # above ran `npm run build`. Keep this step AFTER that build — do not move it earlier.
        run: |
          cd packages/tsa-anchor
          npm ci
          npm test
      - name: signer-core parity gates (packages/signer-core)
        # G1 (RFC 8032 vectors) + G2 (golden-receipt byte-parity vs noa-receipt's own
        # buildReceipt/signEd25519) — the P1a kill-gates from .plan/MOBILE-APP-BUILD-SPEC.md §3.
        # Same `noa-receipt: file:../..` local-repo dependency as tsa-anchor above (needs the
        # root `dist/` already built by the earlier step); `noa-receipt` is a devDependency here
        # ONLY (reference implementation for the G2 test) — the shipped src/ never imports it.
        # `npm run mock-shell` is the runtime proof that the compiled core has no platform-SDK
        # dependency (no DOM/Telegram/React-Native), complementing the compile-time `lib`
        # boundary (tsconfig excludes "dom") this package's tsc build already enforces.
        run: |
          cd packages/signer-core
          npm ci
          npm test
          npm run mock-shell
