name: publish-mcp

# Trusted Publishing (OIDC) — NO NPM_TOKEN, no expiring secret to rotate. Same mechanism as
# publish.yml, but for the two packages under packages/: noa-mcp-adapter-core and noa-mcp-proxy.
# Because these are TWO SEPARATE npm package names, each needs its OWN one-time registry-side
# setup on npmjs.com before the first tag push will work:
#   noa-mcp-adapter-core → Settings → Publishing access / Trusted Publisher → GitHub Actions
#     Organization or user: NordenSoft
#     Repository:           noa
#     Workflow filename:    publish-mcp.yml
#     (Environment:         leave blank)
#   noa-mcp-proxy → repeat the exact same steps (same repo, same workflow filename).
# After both are registered, ship a new release with NO token, ever:
#   git tag mcp-v0.1.0 && git push origin mcp-v0.1.0
# The tag push triggers this job, which tests, lints, and publishes adapter-core, THEN mcp-proxy —
# in that order, because mcp-proxy's own package.json depends on adapter-core via a repo-local
# `file:../adapter-core` reference for local dev/test, which gets swapped to the just-published
# registry version immediately before mcp-proxy's own publish step.

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch: {}   # also allow a manual run from the Actions tab

concurrency:
  group: npm-publish-mcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # REQUIRED: lets the job mint the OIDC token npm exchanges for
                    # short-lived publish credentials (also what enables --provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # REQUIRED by the kernel-parity gate below: it compares HEAD against the kernel's release
          # TAG, and the default shallow checkout carries no tags. The gate fails closed rather than
          # skipping when it cannot see them, so a shallow clone breaks the release loudly instead
          # of silently publishing against an unverified kernel.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            packages/adapter-core/package-lock.json
            packages/signer-sidecar/package-lock.json
            packages/mcp-proxy/package-lock.json

      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node still ships npm 10.x.
      # Pin to the 11.x line: `npm@latest` is now npm@12, which requires node >= 22 (EBADENGINE on
      # this node-20 runner). npm 11.x is >= 11.5.1 (OIDC-capable) AND node-20-compatible.
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1; pin 11.x — npm 12 needs node 22+)
        run: npm install -g npm@11.18.0

      - name: Build the root kernel (adapter-core and signer-sidecar link it via file:../..)
        # Both packages resolve `noa-receipt` from THIS repository tree, not from the registry, so
        # that their suites measure the kernel being released rather than a previously published
        # copy of it. `npm ci` in those packages only creates the symlink — `import "noa-receipt"`
        # then resolves through the root's `main: dist/src/index.js`, which exists only after this
        # build. Without this step every adapter-core test fails with an unresolvable import.
        # Keep it BEFORE the package test gates below; do not move it later.
        run: |
          npm ci
          npm run build

      - name: Gate — packages are versioned in lockstep and (on a tag run) the tag matches
        # The two packages release together under one mcp-v* tag. A mistagged push (tag says
        # 0.2.0, package.json still 0.1.0) would otherwise publish stale or duplicate versions,
        # or fail halfway through the two-package sequence. Fail fast instead.
        run: |
          A="$(node -p "require('./packages/adapter-core/package.json').version")"
          P="$(node -p "require('./packages/mcp-proxy/package.json').version")"
          if [ "$A" != "$P" ]; then
            echo "::error::version mismatch: adapter-core=$A mcp-proxy=$P (lockstep releases required)"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/*)
              TAG="${GITHUB_REF_NAME#mcp-v}"
              if [ "$TAG" != "$A" ]; then
                echo "::error::tag mcp-v$TAG does not match package version $A"
                exit 1
              fi
              ;;
          esac

      - name: Gate — the kernel on the registry is the kernel these packages were tested against
        # These packages are TESTED against the kernel in this tree (`file:../..`) and SHIPPED
        # depending on the kernel on the registry. Those are only the same artifact if the kernel
        # version was bumped and released whenever its published surface changed.
        #
        # The step below that rewrites the dependency already asks whether `noa-receipt@$KV` exists
        # on the registry — which catches "bumped but not published". It cannot catch the opposite
        # and more likely mistake, "changed but NOT bumped", because then the old version string
        # still resolves and the check goes green while the two kernels differ. Measured 2026-08-01:
        # published 0.5.0 had 51 exports and no retirement enforcement, this tree's 0.5.0 had 69 and
        # the P0-14 fix, 37 commits apart, and that check passed. Publishing then would have shipped
        # `import { resolveVerificationKey } from "noa-receipt"` against a kernel that does not
        # export it — a load-time crash for every consumer, unpublishable back off the registry.
        #
        # This gate asks the question in the form that can fail: has anything in the kernel's
        # published surface moved since its release tag? It fails closed when it cannot measure.
        run: node scripts/lint-kernel-release-parity.mjs

      - name: adapter-core test gate (never publish broken)
        working-directory: packages/adapter-core
        run: |
          npm ci
          npm test

      - name: signer-sidecar deps + test gate (mcp-proxy's --signer-socket smoke spawns it)
        # signer-sidecar is NOT published this release (it is mcp-proxy's OPTIONAL dependency), but
        # mcp-proxy's own smoke test (Bonus S/T) spawns packages/signer-sidecar/src/sidecar.mjs,
        # which needs signer-sidecar's own node_modules (noa-mcp-adapter-core and noa-receipt, both
        # via file:). Must run AFTER adapter-core's npm ci populated the file: link target, and
        # after the root build — the noa-receipt link resolves through the root's dist/.
        working-directory: packages/signer-sidecar
        run: |
          npm ci
          npm test

      - name: mcp-proxy test gate (never publish broken)
        # Must run AFTER the adapter-core step above: mcp-proxy links adapter-core via
        # file:../adapter-core, and Node resolves adapter-core's own noa-receipt dependency
        # from packages/adapter-core/node_modules — which only exists because the previous
        # step's `npm ci` populated it (npm does not install a file: dep's dependencies
        # across the link boundary). Do not split these steps into parallel jobs.
        working-directory: packages/mcp-proxy
        run: |
          npm ci
          npm test

      - name: Lint the published surface — adapter-core (K4 internal-process jargon + K5 security-marketing claims)
        run: node scripts/lint-published-surface.mjs --dir packages/adapter-core

      - name: Lint the published surface — mcp-proxy (K4 internal-process jargon + K5 security-marketing claims)
        run: node scripts/lint-published-surface.mjs --dir packages/mcp-proxy

      - name: Point adapter-core at the published noa-receipt registry version
        # adapter-core declares `noa-receipt: file:../..` so its tests measure THIS repository's
        # kernel. The published tarball must depend on the registry package instead — a consumer
        # who installed `file:../..` would resolve it against their own tree and get garbage or an
        # install failure. The version is read from the root package.json, NOT hardcoded.
        #
        # FAIL-CLOSED ON AN UNPUBLISHED KERNEL: if the root version is not on the registry, this
        # would ship a dependency nobody can install. The correct action is to release the kernel
        # first, never to publish adapter-core pointing at a version that does not exist.
        #
        # THIS CHECK ALONE IS NOT SUFFICIENT, and the original wording of this comment claimed it
        # covered "the kernel has been changed but not released" — it does not. Existence of the
        # version string says nothing about the content behind it, and the changed-but-not-bumped
        # case leaves the string resolvable. That half is covered by the kernel-parity gate above;
        # the two are complementary and neither is redundant.
        working-directory: packages/adapter-core
        run: |
          KV="$(node -p "require('../../package.json').version")"
          if [ -z "$(npm view "noa-receipt@$KV" version 2>/dev/null || true)" ]; then
            echo "::error::noa-receipt@$KV is not on the registry. Publishing adapter-core with a"
            echo "::error::dependency on ^$KV would ship an uninstallable package. Release the"
            echo "::error::kernel first, then re-run this workflow."
            exit 1
          fi
          npm pkg set "dependencies.noa-receipt=^$KV"

      - name: Prove adapter-core's TARBALL carries no local-path dependency
        # The rewrites above are write-only operations; nothing until now confirmed they took
        # effect, covered every dependency, or survived a newly added local dep. This packs the
        # exact bytes npm would upload and reads the manifest out of the tarball.
        run: node scripts/lint-publish-tarball-deps.mjs --dir packages/adapter-core

      - name: Publish adapter-core to npm via OIDC (no token, with provenance)
        # Skip-if-published makes a rerun after a partial failure safe: if adapter-core landed
        # but mcp-proxy's publish failed, rerunning the workflow must not die here with E409.
        working-directory: packages/adapter-core
        run: |
          V="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "noa-mcp-adapter-core@$V" version 2>/dev/null || true)" ]; then
            echo "noa-mcp-adapter-core@$V is already on the registry — skipping publish (rerun path)"
          else
            npm publish --provenance --access public
          fi

      - name: Point mcp-proxy at the just-published adapter-core registry version
        # packages/mcp-proxy/package.json declares noa-mcp-adapter-core as "file:../adapter-core"
        # for local dev/test against the sibling package on disk. The published tarball must
        # depend on the real registry package instead. The version is read from adapter-core's
        # own package.json (published in the previous step), NOT hardcoded — a hardcoded range
        # would silently pin future releases to the old adapter-core.
        working-directory: packages/mcp-proxy
        run: |
          V="$(node -p "require('../adapter-core/package.json').version")"
          npm pkg set "dependencies.noa-mcp-adapter-core=^$V"

      - name: Point mcp-proxy's OPTIONAL signer-sidecar dep at a published range (kept optional)
        # noa-signer-sidecar is an optionalDependency (used only on the opt-in --signer-socket path),
        # declared "file:../signer-sidecar" for local dev/test. The published tarball must carry a
        # registry range instead. The version is read from signer-sidecar's own package.json, NOT
        # hardcoded. It stays OPTIONAL: this workflow does NOT publish signer-sidecar, so until that
        # package is on the registry a consumer's install simply SKIPS it (optional installs never
        # fail the whole install); once it is published, a later reinstall picks it up. mcp-proxy's
        # default (in-process key) path needs it never — only --signer-socket lazy-imports it.
        working-directory: packages/mcp-proxy
        run: |
          SV="$(node -p "require('../signer-sidecar/package.json').version")"
          npm pkg set "optionalDependencies.noa-signer-sidecar=^$SV"

      - name: Prove mcp-proxy's TARBALL carries no local-path dependency
        # Covers BOTH rewrites above (the adapter-core dependency and the optional signer-sidecar
        # one) against the artifact itself rather than against the intent of the steps that wrote
        # them. optionalDependencies are inspected too: an unusable optional path is skipped at
        # install time rather than failing loudly, which makes it harder to notice, not safer.
        run: node scripts/lint-publish-tarball-deps.mjs --dir packages/mcp-proxy

      - name: Publish mcp-proxy to npm via OIDC (no token, with provenance)
        # Same skip-if-published rerun guard as adapter-core above.
        working-directory: packages/mcp-proxy
        run: |
          V="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "noa-mcp-proxy@$V" version 2>/dev/null || true)" ]; then
            echo "noa-mcp-proxy@$V is already on the registry — skipping publish (rerun path)"
          else
            npm publish --provenance --access public
          fi
