name: publish

# Trusted Publishing (OIDC) — NO NPM_TOKEN, no expiring secret to rotate.
# npm trusts GitHub Actions' OIDC identity for this exact repo + workflow and
# mints short-lived publish credentials on the fly. One-time setup on npmjs.com:
#   noa-receipt → Settings → Publishing access / Trusted Publisher → GitHub Actions
#     Organization or user: NordenSoft
#     Repository:           noa
#     Workflow filename:    publish.yml
#     (Environment:         leave blank)
# After that, ship a new version with NO token, ever:
#   npm version patch    # bumps package.json + creates a vX.Y.Z tag
#   git push --follow-tags
# The tag push triggers this job, which builds, tests, and publishes via OIDC
# with a provenance attestation (signed proof the artifact was built from this repo).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # also allow a manual run from the Actions tab

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # REQUIRED: lets the job mint the OIDC token npm exchanges for
                    # short-lived publish credentials (also what enables --provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # go/rust/dotnet are needed by `prepublishOnly`'s `check:matrix` step below, which now
      # regenerates conformance/MATRIX.md's Go/Rust/C# columns (in addition to TS/Python) and diffs
      # it against the committed copy — same toolchains as .github/workflows/ci.yml's
      # `five-verifier-conformance` job, pinned to the same versions so the two never silently
      # diverge on what "conformant" measures at publish time vs. on every push.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: impl-go/go.mod
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node still ships npm 10.x.
      # Pin to the 11.x line: `npm@latest` is now npm@12, which requires node >= 22 (EBADENGINE on
      # this node-20 runner). npm 11.x is >= 11.5.1 (OIDC-capable) AND node-20-compatible.
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1; pin 11.x — npm 12 needs node 22+)
        run: npm install -g npm@11.18.0

      - run: npm ci

      - name: Build + generate vectors + test (never publish broken)
        run: npm test

      - name: Publish to npm via OIDC (no token, with provenance)
        # prepublishOnly (package.json) runs here: npm test, inert-core check, dogfood suite, the
        # TS<->Python cross-impl proof, the publish-surface lint, and check:matrix — which now
        # regenerates AND diffs all five conformance columns, so a stale or overstated matrix blocks
        # publish exactly like a failing test would.
        run: npm publish --provenance --access public
