name: publish-tsa

# Trusted Publishing (OIDC) — NO NPM_TOKEN, no expiring secret to rotate. Same mechanism as
# publish.yml / publish-mcp.yml, for the single package packages/tsa-anchor (npm name:
# noa-tsa-anchor).
#
# ─── THE FIRST RELEASE CANNOT USE THIS WORKFLOW, AND SAYING OTHERWISE WOULD WASTE A RELEASE ──────
# `noa-tsa-anchor` does not exist on the registry, and npm requires a package to EXIST before a
# trusted publisher can be configured for it. So the OIDC-first ordering is impossible for v0.1.0:
#
#   STEP 1 (once, by hand, by the lead — this workflow cannot do it):
#     cd packages/tsa-anchor
#     npm pkg set "dependencies.noa-receipt=^$(node -p "require('../../package.json').version")"
#     npm publish --access public          # prepublishOnly runs the suite AND the tarball gate
#     git checkout -- package.json         # put the file: dependency back for local development
#
#   STEP 2 (once, on npmjs.com, after the package exists):
#     noa-tsa-anchor → Settings → Publishing access / Trusted Publisher → GitHub Actions
#       Organization or user: NordenSoft
#       Repository:           noa
#       Workflow filename:    publish-tsa.yml
#       Environment:          npm-publish
#
#   STEP 2b (once, in this repository — the OIDC subject is only as good as what guards it):
#     Settings → Environments → npm-publish → add REQUIRED REVIEWERS, and restrict the environment
#     to protected tags. Trusted publishing authenticates the WORKFLOW; it says nothing about who
#     asked it to run or what commit it was pointed at. Without a reviewer on the environment, write
#     access to the repository is publish access to the package.
#
#   STEP 3 (every release after that, with no token, ever):
#     git tag tsa-v0.1.1 && git push origin tsa-v0.1.1
#
# Node is pinned to 22, not 20: npm's trusted publishing requires Node >= 22.14, and a node-20
# runner would fail the OIDC exchange after every gate below had already passed.
#
# WHY A SEPARATE WORKFLOW rather than a third package inside publish-mcp.yml: that workflow releases
# adapter-core and mcp-proxy IN LOCKSTEP under one version, because mcp-proxy depends on
# adapter-core. tsa-anchor depends on neither and versions independently, so folding it in would
# either force a fake lockstep or add a conditional to a sequence whose ordering is load-bearing.

on:
  push:
    tags:
      - 'tsa-v*'
  # WHAT A MANUAL RUN CAN AND CANNOT DO, stated exactly, because the previous wording claimed an
  # invariant this workflow does not have:
  #   - On a BRANCH: the job-level `if` skips the entire job, so nothing runs — not the publish, and
  #     not the gates either. A dispatch is therefore useless for rehearsing them; run the gates
  #     locally (`npm test`, `npm run check:tarball`) or read them off a real tag run.
  #   - On a TAG: a dispatcher can select a tag as the ref, and that DOES reach `npm publish`. It is
  #     bounded rather than forbidden — the ancestry gate, the version/tag match and the `npm-publish`
  #     environment's reviewers all still apply, and npm refuses a duplicate version — but "a manual
  #     run can never publish" would be false and is not claimed.
  workflow_dispatch: {}

concurrency:
  group: npm-publish-tsa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # REQUIRED: lets the job mint the OIDC token npm exchanges for
                    # short-lived publish credentials (also what enables --provenance)

jobs:
  publish:
    # THE ONLY WAY THIS JOB RUNS IS A tsa-v* TAG. Not a branch, not a fork, and not a branch dispatch.
    if: startsWith(github.ref, 'refs/tags/tsa-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A HUMAN GATE ON THE RELEASE ITSELF. The tag condition proves the ref is a tag; it proves
    # nothing about who created it. Configure `npm-publish` with required reviewers (see the header):
    # without that, this line is documentation, and with it the job waits for an approval it cannot
    # grant itself.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # REQUIRED by the kernel-parity gate below: it compares HEAD against the kernel's release
          # TAG, and the default shallow checkout carries no tags. The gate fails closed rather than
          # skipping when it cannot see them, so a shallow clone breaks the release loudly instead
          # of silently publishing against an unverified kernel.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/tsa-anchor/package-lock.json

      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node still ships npm 10.x.
      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1 on Node >= 22.14)
        run: npm install -g npm@11.18.0

      - name: Build the root kernel (tsa-anchor links it via file:../..)
        # tsa-anchor resolves `noa-receipt` from THIS repository tree, not from the registry, so its
        # suite measures the kernel being released rather than a previously published copy of it.
        # `npm ci` in the package only creates the symlink — `import "noa-receipt"` then resolves
        # through the root's `main: dist/src/index.js`, which exists only after this build.
        # Keep it BEFORE the test gate below; do not move it later.
        run: |
          npm ci
          npm run build

      - name: Gate — the tagged commit is reviewed history, not an arbitrary commit
        # A TAG NAME IS NOT PROVENANCE. The version check below compares the tag's TEXT to
        # package.json, which anyone with write access can satisfy: tag any unreviewed commit
        # `tsa-v9.9.9`, bump the version on that same commit, and the workflow would have published
        # it with OIDC and provenance attached — provenance that would faithfully attest a commit
        # nobody reviewed. "It is a tag, not a branch" is true and beside the point, because a tag
        # can point anywhere, including at a branch tip.
        #
        # So the released commit must be an ANCESTOR OF main: whatever the tag is called, its
        # content went through the branch's own review. A force-moved tag is also bounded by this —
        # it can only ever move to another commit that is already on main.
        #
        # It cannot bind tag NAME to commit permanently: a tag is mutable, so re-running this
        # workflow after a force-move republishes under the same name from a different commit. npm's
        # immutable versions stop that from overwriting a released version, and the SHA is printed
        # below so the run log records exactly what was shipped. The residual gap is recorded in
        # NON-CLAIMS.md rather than papered over here.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is NOT an ancestor of origin/main."
            echo "::error::Releases are cut from reviewed history. Merge the commit first, then tag the merged SHA."
            exit 1
          fi
          echo "released commit: $GITHUB_SHA (ancestor of origin/main)"
          echo "released commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate — the tag matches the package version
        # A mistagged push (tag says 0.2.0, package.json still 0.1.0) would otherwise publish a
        # stale or duplicate version. UNCONDITIONAL: the job's own `if` already guarantees a tag,
        # so there is no non-tag case to skip for — and a `case` that silently matched nothing was
        # exactly how a branch run used to sail past this gate.
        run: |
          V="$(node -p "require('./packages/tsa-anchor/package.json').version")"
          TAG="${GITHUB_REF_NAME#tsa-v}"
          if [ "$TAG" != "$V" ]; then
            echo "::error::tag tsa-v$TAG does not match package version $V"
            exit 1
          fi

      - name: Gate — the kernel on the registry is the kernel this package was tested against
        # tsa-anchor is TESTED against the kernel in this tree (`file:../..`) and SHIPPED depending
        # on the kernel on the registry. Those are only the same artifact if the kernel version was
        # bumped and released whenever its published surface changed.
        #
        # The dependency-rewrite step below already asks whether `noa-receipt@$KV` EXISTS on the
        # registry, which catches "bumped but not published". It cannot catch the opposite and more
        # likely mistake, "changed but NOT bumped", because then the old version string still
        # resolves and the check goes green while the two kernels differ. This gate asks the
        # question in the form that can fail, and fails closed when it cannot measure. Its SELFTEST
        # runs first: a gate that had quietly stopped measuring would otherwise publish.
        run: npm run lint:release-parity

      - name: tsa-anchor test gate (never publish broken)
        working-directory: packages/tsa-anchor
        run: |
          npm ci
          npm test

      - name: Lint the published surface (K4 internal-process jargon + K5 security-marketing claims)
        run: node scripts/lint-published-surface.mjs --dir packages/tsa-anchor

      - name: Prove the tarball gate can actually FAIL (selftest against the un-rewritten tree)
        # Run BEFORE the rewrite, where a local-path dependency is present and correct. A gate that
        # has never been observed to fail is not known to be a gate: this asserts it detects the
        # `file:../..` that the next step removes, so the post-rewrite green means "the rewrite
        # worked" rather than "the check passes everything".
        run: node scripts/lint-publish-tarball-deps.mjs --dir packages/tsa-anchor --expect-local

      - name: Point tsa-anchor at the published noa-receipt registry version
        # tsa-anchor declares `noa-receipt: file:../..` so its tests measure THIS repository's
        # kernel. The published tarball must depend on the registry package instead — a consumer who
        # installed `file:../..` would resolve it against their own tree and get garbage or an
        # install failure. The version is read from the root package.json, NOT hardcoded.
        #
        # FAIL-CLOSED ON AN UNPUBLISHED KERNEL: if the root version is not on the registry, this
        # would ship a dependency nobody can install. The correct action is to release the kernel
        # first, never to publish pointing at a version that does not exist.
        working-directory: packages/tsa-anchor
        run: |
          KV="$(node -p "require('../../package.json').version")"
          if [ -z "$(npm view "noa-receipt@$KV" version 2>/dev/null || true)" ]; then
            echo "::error::noa-receipt@$KV is not on the registry. Publishing tsa-anchor with a"
            echo "::error::dependency on ^$KV would ship an uninstallable package. Release the"
            echo "::error::kernel first, then re-run this workflow."
            exit 1
          fi
          npm pkg set "dependencies.noa-receipt=^$KV"

      - name: Prove the TARBALL carries no local-path dependency
        # The rewrite above is a write-only operation; nothing until now confirms it took effect,
        # covered every dependency, or survived a newly added local dep. This packs the exact bytes
        # npm would upload and reads the manifest out of the tarball.
        run: node scripts/lint-publish-tarball-deps.mjs --dir packages/tsa-anchor

      - name: Publish tsa-anchor to npm via OIDC (no token, with provenance)
        # Skip-if-published makes a rerun after a partial failure safe rather than dying with E409.
        working-directory: packages/tsa-anchor
        run: |
          V="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "noa-tsa-anchor@$V" version 2>/dev/null || true)" ]; then
            echo "noa-tsa-anchor@$V is already on the registry — skipping publish (rerun path)"
          else
            npm publish --provenance --access public
          fi
